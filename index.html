<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulación de colas</title>
<style>
body { margin: 0; background: #eef1f5; color: #222; font-family: "Segoe UI", Arial, sans-serif; }
main { max-width: 1050px; margin: 0 auto; padding: 24px 16px; }
h1 { margin: 0 0 4px; color: #1f3b5a; }
h2 { margin: 0 0 12px; color: #1f3b5a; font-size: 19px; }
.nota { margin-top: 0; color: #5b6673; }
.caja { margin-bottom: 18px; padding: 18px 20px; background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 18px; }
label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: bold; }
input, textarea { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #b8c2cc; border-radius: 6px; font-size: 14px; }
input + textarea { margin-top: 8px; }
textarea { font-family: Consolas, monospace; resize: vertical; }
button { padding: 11px 26px; border: none; border-radius: 6px; background: #1f6feb; color: white; font-size: 16px; }
.tabla { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { padding: 8px 6px; background: #1f3b5a; color: white; }
td { padding: 6px; text-align: center; border-bottom: 1px solid #dde3ea; }
tr:nth-child(even) td { background: #f6f8fa; }
.optimo { margin-bottom: 4px; color: #1a7f37; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<main>
<h1>Simulación de colas</h1>

<form method="POST">

<div class="caja">
<h2>Horario</h2>
<div class="campos">
<div><label>Abre el almacén</label><input name="apertura" value="23:00"></div>
<div><label>Hora límite para recibir camiones</label><input name="limite" value="07:30"></div>
<div><label>Hora de comida</label><input name="comida" value="03:00"></div>
<div><label>Minutos de comida</label><input name="duracion_comida" value="30"></div>
</div>
</div>

<div class="caja">
<h2>Costos por hora</h2>
<div class="campos">
<div><label>Salario normal por persona ($)</label><input name="salario" value="25"></div>
<div><label>Salario extra por persona ($)</label><input name="salario_extra" value="37.5"></div>
<div><label>Camión esperando ($)</label><input name="costo_espera" value="100"></div>
<div><label>Almacén operando ($)</label><input name="costo_almacen" value="500"></div>
</div>
</div>

<div class="caja">
<h2>Tablas de probabilidad</h2>
<div class="campos">
<div><label>Camiones esperando al abrir</label><textarea name="inicial" rows="9">
0 0.50
1 0.25
2 0.15
3 0.10</textarea></div>
<div><label>Tiempo entre llegadas (min)</label><textarea name="llegadas" rows="9">
20 0.02
25 0.08
30 0.12
35 0.25
40 0.20
45 0.15
50 0.10
55 0.05
60 0.03</textarea></div>
</div>
</div>

<div class="caja">
<h2>Equipos a comparar</h2>
<div class="campos">
<div><label>Personas</label><input name="personas1" value="3"><textarea name="servicio1" rows="9">
20 0.05
25 0.10
30 0.20
35 0.25
40 0.12
45 0.10
50 0.08
55 0.06
60 0.04</textarea></div>
<div><label>Personas</label><input name="personas2" value="4"><textarea name="servicio2" rows="9">
15 0.05
20 0.15
25 0.20
30 0.20
35 0.15
40 0.12
45 0.08
50 0.04
55 0.01</textarea></div>
<div><label>Personas</label><input name="personas3" value="5"><textarea name="servicio3" rows="9">
10 0.10
15 0.18
20 0.22
25 0.18
30 0.10
35 0.08
40 0.06
45 0.05
50 0.03</textarea></div>
<div><label>Personas</label><input name="personas4" value="6"><textarea name="servicio4" rows="9">
5 0.12
10 0.15
15 0.26
20 0.15
25 0.12
30 0.08
35 0.06
40 0.04
45 0.02</textarea></div>
</div>
</div>

<div class="caja">
<h2>Números aleatorios (opcional)</h2>
<div class="campos">
<div><label>Para camiones al abrir</label><input name="r_inicial"></div>
<div><label>Para llegadas</label><textarea name="r_llegadas" rows="3"></textarea></div>
<div><label>Para servicio</label><textarea name="r_servicio" rows="3"></textarea></div>
</div>
</div>

<button>Simular</button>
</form>
</main>
</body>
</html>
